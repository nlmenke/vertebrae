services:

  laravel.test:
    build:
      context: ./docker/${PHP_VERSION}
      dockerfile: Dockerfile
      args:
        WWWGROUP: ${WWWGROUP}
    image: sail-${PHP_VERSION}/app
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - ${APP_PORT:-80}:80
      - ${VITE_PORT:-5173}:${VITE_PORT:-5173}
    environment:
      WWWUSER: ${WWWUSER}
      LARAVEL_SAIL: 1
      XDEBUG_MODE: ${SAIL_XDEBUG_MODE:-off}
      XDEBUG_CONFIG: ${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}
      IGNITION_LOCAL_SITES_PATH: ${PWD}
    volumes:
      - .:/var/www/html
    networks:
      - sail
    depends_on:
      - mysql
      - pgsql
      - redis
      - rustfs
      - mailpit

  mysql:
    image: mysql:8.4
    ports:
      - ${FORWARD_DB_PORT:-3306}:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: ${DB_DATABASE:-vertebrae}
      MYSQL_USER: ${DB_USERNAME:-sail}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
      MYSQL_EXTRA_OPTIONS: ${MYSQL_EXTRA_OPTIONS:-}
    volumes:
      - mysql:/var/lib/mysql
      - ./docker/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh
    networks:
      - sail
    healthcheck:
      test: [ CMD, mysqladmin, ping, '-p${DB_PASSWORD}' ]
      retries: 3
      timeout: 5s

  pgsql:
    image: postgres:18-alpine
    ports:
      - ${FORWARD_DB_PORT:-5432}:5432
    environment:
      PGPASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_DATABASE:-vertebrae}
      POSTGRES_USER: ${DB_USERNAME:-sail}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - pgsql:/var/lib/postgresql
      - ./docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql
    networks:
      - sail
    healthcheck:
      test: [ CMD, pg_isready, -q, -d, '${DB_DATABASE}', -U, '${DB_USERNAME}' ]
      retries: 3
      timeout: 5s

  redis:
    image: redis:alpine
    ports:
      - ${FORWARD_REDIS_PORT:-6379}:6379
    volumes:
      - redis:/data
    networks:
      - sail
    command: redis-server --requirepass '${REDIS_PASSWORD:-null}'
    healthcheck:
      test: [ CMD, redis-cli, ping ]
      retries: 3
      timeout: 5s

  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - ${FORWARD_RUSTFS_PORT:-9000}:9000
      - ${FORWARD_RUSTFS_CONSOLE_PORT:-9001}:9001
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:${RUSTFS_PORT:-9000}
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:${RUSTFS_CONSOLE_PORT:-9001}
      RUSTFS_CONSOLE_ENABLE: true
      RUSTFS_EXTERNAL_ADDRESS: :${RUSTFS_PORT:-9000}
      RUSTFS_CORS_ALLOWED_ORIGINS: '*'
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: '*'
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-sail}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-password}
    volumes:
      - rustfs:/data
    networks:
      - sail
    healthcheck:
      test: [ CMD, sh, -c, "curl -f http://127.0.0.1:${RUSTFS_PORT:-9000}/health && curl -f http://127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - ${FORWARD_MAILPIT_PORT:-1025}:1025
      - ${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025
    volumes:
      - mailpit:/data
    networks:
      - sail

  adminer:
    image: adminer
    ports:
      - '${ADMINER_PORT:-8081}:8080'
    networks:
      - sail
    depends_on:
      - mysql
      - pgsql

networks:
  sail:
    driver: bridge

volumes:
  mysql:
    driver: local
  pgsql:
    driver: local
  redis:
    driver: local
  rustfs:
    driver: local
  mailpit:
    driver: local
